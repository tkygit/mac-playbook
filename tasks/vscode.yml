---
- name: List installed VS Code extensions.
  command:
    argv:
      - "{{ vscode_cli }}"
      - --list-extensions
  register: vscode_installed_extensions
  changed_when: false

- name: Install missing VS Code extensions.
  command:
    argv:
      - "{{ vscode_cli }}"
      - --install-extension
      - "{{ item }}"
  loop: "{{ vscode_extensions }}"
  when: item | lower not in (vscode_installed_extensions.stdout_lines | map('lower') | list)
